<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustomTPA - Modern Teleport Requests</title>
    <link rel="icon" href="https://i.ibb.co/JR9kvR91/Custom-TPA-2-1.png">
    <style>
        :root {
            --bg: #0d0d0d;
            --gold: #ffaa00;
            --purple: #b366ff;
            --text: #cccccc;
            --glass: rgba(255,255,255,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 20% 50%, rgba(179,102,255,0.08), transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(255,170,0,0.08), transparent 50%);
            animation: bgPulse 8s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }
        .container {
            position: relative;
            z-index: 1;
            animation: fadeIn 1.2s ease;
            padding: 20px;
            max-width: 100%;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .logo {
            max-width: 200px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 20px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255,170,0,0.15));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .gradient-text {
            font-size: clamp(2.2em, 8vw, 3.5em);
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--purple), var(--gold));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 4s ease-in-out infinite;
            margin-bottom: 10px;
            word-break: break-word;
        }
        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .subtitle {
            font-size: clamp(1em, 3vw, 1.3em);
            color: var(--text);
            margin-bottom: 10px;
            opacity: 0.9;
        }
        .version-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--purple), #7a2e8a);
            color: white;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: clamp(0.8em, 2vw, 1em);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
            box-shadow: 0 0 30px rgba(179,102,255,0.2);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(179,102,255,0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px 15px rgba(179,102,255,0.15); }
        }
        .lang-select {
            display: flex;
            gap: clamp(15px, 4vw, 30px);
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .lang-card {
            background: rgba(26,26,26,0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: clamp(20px, 4vw, 35px) clamp(25px, 5vw, 45px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: var(--text);
            display: block;
            min-width: clamp(120px, 30vw, 160px);
            flex: 0 1 auto;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            perspective: 800px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .lang-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,170,0,0.06), transparent 70%);
            transition: 0.6s;
            opacity: 0;
        }
        .lang-card:hover::before {
            opacity: 1;
            transform: scale(1.2);
        }
        .lang-card:hover {
            border-color: var(--gold);
            transform: translateY(-10px) scale(1.03) rotateX(2deg) rotateY(2deg);
            box-shadow: 0 30px 60px rgba(255,170,0,0.15);
        }
        .lang-card img {
            width: clamp(50px, 12vw, 70px);
            height: auto;
            aspect-ratio: 16/10;
            margin-bottom: 12px;
            border-radius: 6px;
            transition: 0.3s;
        }
        .lang-card:hover img {
            transform: scale(1.1) rotate(-2deg);
        }
        .lang-card h2 {
            background: linear-gradient(135deg, var(--gold), #ffdd77);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0 5px;
            font-size: clamp(1.2em, 3vw, 1.6em);
        }
        .lang-card p {
            color: var(--text);
            font-size: 0.9em;
            opacity: 0.7;
        }
        .lang-card .glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,170,0,0.03), transparent 70%);
            transition: 0.6s;
            opacity: 0;
            pointer-events: none;
        }
        .lang-card:hover .glow {
            opacity: 1;
            transform: scale(1.5);
        }

        /* ===== Кнопки платформ ===== */
        .platform-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            margin-top: 10px;
        }
        .platform-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 60px;
            text-decoration: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-weight: 600;
            font-size: 0.95em;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: subtleFloat 4s ease-in-out infinite;
        }
        .platform-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 2;
        }
        .platform-btn span {
            position: relative;
            z-index: 2;
            transition: all 0.4s ease;
        }
        .platform-btn .badge {
            background: rgba(255,255,255,0.08);
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.6em;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s ease;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 2;
        }
        .platform-btn .btn-glow {
            position: absolute;
            inset: -2px;
            border-radius: 62px;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.3), transparent 60%);
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 0;
            animation: rotateGlow 3s linear infinite;
            pointer-events: none;
        }
        .platform-btn:hover .btn-glow {
            opacity: 1;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .platform-btn:hover {
            transform: translateY(-4px) scale(1.05);
            animation-play-state: paused;
        }
        .platform-btn:hover svg {
            transform: rotate(-6deg) scale(1.1);
            filter: drop-shadow(0 0 16px rgba(255,255,255,0.2));
        }
        .platform-btn:hover .badge {
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.9);
            border-color: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }
        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .github-btn { background: linear-gradient(135deg, #24292e, #1a1a2e); border-color: rgba(110,84,148,0.2); }
        .github-btn:hover { box-shadow: 0 12px 40px rgba(110,84,148,0.35); }
        .github-btn .btn-glow { background: conic-gradient(from 0deg, transparent, rgba(179,102,255,0.5), transparent 60%); }

        .modrinth-btn { background: linear-gradient(135deg, #1bd96a, #0fa84a); border-color: rgba(27,217,106,0.2); }
        .modrinth-btn:hover { box-shadow: 0 12px 40px rgba(27,217,106,0.35); }
        .modrinth-btn .btn-glow { background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.5), transparent 60%); }

        .spigot-btn { background: linear-gradient(135deg, #db6a1b, #a84a0f); border-color: rgba(219,106,27,0.2); }
        .spigot-btn:hover { box-shadow: 0 12px 40px rgba(219,106,27,0.35); }
        .spigot-btn .btn-glow { background: conic-gradient(from 0deg, transparent, rgba(255,200,100,0.5), transparent 60%); }

        @media (max-width: 600px) {
            .gradient-text { font-size: 2.4em; }
            .lang-card { padding: 25px 30px; min-width: 120px; }
            .platform-btn { padding: 10px 18px; font-size: 0.85em; gap: 8px; }
            .platform-btn svg { width: 18px; height: 18px; }
            .platform-btn .badge { display: none; }
        }
        @media (max-width: 400px) {
            .platform-btn { padding: 8px 14px; font-size: 0.75em; gap: 6px; border-radius: 40px; }
            .platform-btn svg { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="container">
        <img class="logo" src="https://i.ibb.co/0RpM2yYS/all-platforms.png" alt="CustomTPA">
        <h1 class="gradient-text">🌐 CustomTPA</h1>
        <p class="subtitle">Choose your language / Выберите язык</p>
        <div class="version-badge">v2.3.0 · 70 languages</div>
        <div class="lang-select">
            <a href="/en" class="lang-card">
                <div class="glow"></div>
                <img src="https://flagcdn.com/w80/gb.png" alt="English">
                <h2>English</h2>
                <p>🇬🇧 EN</p>
            </a>
            <a href="/ru" class="lang-card">
                <div class="glow"></div>
                <img src="https://flagcdn.com/w80/ru.png" alt="Русский">
                <h2>Русский</h2>
                <p>🇷🇺 RU</p>
            </a>
        </div>

        <!-- ===== Кнопки платформ ===== -->
        <div class="platform-buttons">
            <a href="https://github.com/MrKronick/CustomTPA/releases" target="_blank" class="platform-btn github-btn">
                <span class="btn-glow"></span>
                <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                <span>GitHub</span>
                <span class="badge">v2.3.0</span>
            </a>
            <a href="https://modrinth.com/plugin/customtpa" target="_blank" class="platform-btn modrinth-btn">
                <span class="btn-glow"></span>
                <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 22.5c-5.799 0-10.5-4.701-10.5-10.5S6.201 1.5 12 1.5 22.5 6.201 22.5 12 17.799 22.5 12 22.5z" fill="currentColor"/><path d="M15.6 7.2h-3.6v3.6h3.6V7.2zm0 6h-3.6v3.6h3.6v-3.6zm-6-6H6v3.6h3.6V7.2zm0 6H6v3.6h3.6v-3.6z" fill="currentColor"/></svg>
                <span>Modrinth</span>
                <span class="badge">Download</span>
            </a>
            <a href="https://www.spigotmc.org/resources/customtpa.136316/" target="_blank" class="platform-btn spigot-btn">
                <span class="btn-glow"></span>
                <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z" fill="currentColor"/><path d="M12 6l-2 4h4l-2-4zm0 12l2-4h-4l2 4zm-4-6l4-2-4-2v4zm8 0l-4 2 4 2v-4z" fill="currentColor"/></svg>
                <span>SpigotMC</span>
                <span class="badge">v2.3.0</span>
            </a>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.createElement('canvas');
            canvas.id = 'particles-canvas';
            canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;';
            document.body.prepend(canvas);
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.5;
                    this.speedY = (Math.random() - 0.5) * 0.5;
                    this.opacity = Math.random() * 0.5 + 0.1;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset();
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 170, 0, ${this.opacity})`;
                    ctx.fill();
                }
            }
            for (let i = 0; i < 80; i++) particles.push(new Particle());
            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>
