<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d" id="metaTheme">
<meta name="description" content="CustomTPA — modern teleport requests plugin for Paper, Spigot, Folia. 70 languages, GUI, Vault economy.">
<title>CustomTPA — Modern Teleport Requests</title>
<link rel="icon" href="https://i.ibb.co/JR9kvR91/Custom-TPA-2-1.png">
<style>
/* ===== THEMES ===== */
html[data-theme="dark"]{
    --bg:#0d0d0d; --bg-alt:#111; --card:#1a1a1a; --card-hover:#222;
    --text:#cccccc; --text-bright:#fff; --gray:#888;
    --border:#333; --border-subtle:#2a2a2a;
    --code-bg:#2a2a2a; --pre-bg:#0a0a0a;
    --hover-row:rgba(255,170,0,.05);
    --header-gradient:linear-gradient(135deg,#1a1a2e,#16213e,#1a1a2e);
    --shadow:rgba(0,0,0,.4);
    --toggle-bg:rgba(255,255,255,.05);
    --toggle-border:rgba(255,255,255,.1);
    --toggle-hover:rgba(255,255,255,.12);
}
html[data-theme="light"]{
    --bg:#f4f4f8; --bg-alt:#fff; --card:#fff; --card-hover:#f9f9fc;
    --text:#444455; --text-bright:#1a1a1a; --gray:#666677;
    --border:#e0e0e8; --border-subtle:#eeeef4;
    --code-bg:#eeeef4; --pre-bg:#f8f8fc;
    --hover-row:rgba(255,170,0,.08);
    --header-gradient:linear-gradient(135deg,#e8e8f4,#d8d8ec,#e8e8f4);
    --shadow:rgba(0,0,0,.1);
    --toggle-bg:rgba(255,255,255,.85);
    --toggle-border:rgba(0,0,0,.1);
    --toggle-hover:rgba(0,0,0,.06);
}
:root{
    --gold:#ffaa00; --purple:#b366ff;
    --green:#55ff55; --red:#ff5555; --yellow:#ffff55;
    --transition:.3s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
    background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;
    line-height:1.6; overflow-x:hidden; min-height:100vh;
    transition:background var(--transition),color var(--transition);
    -webkit-font-smoothing:antialiased;
}
a{color:var(--gold);text-decoration:none;transition:.3s}
a:hover{color:var(--purple);text-decoration:underline}

/* ===== KEYFRAMES ===== */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.05);opacity:1}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes gradientMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes rotateGlow{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes subtleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
    }
}

.fade-in{opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s ease}
.fade-in.visible{opacity:1;transform:translateY(0)}
.delay-1{transition-delay:.15s}.delay-2{transition-delay:.3s}.delay-3{transition-delay:.45s}

.container{max-width:960px;margin:0 auto;padding:clamp(15px,3vw,20px)}

/* ===== HEADER ===== */
header{
    text-align:center;
    padding:clamp(60px,10vw,80px) clamp(15px,3vw,20px) clamp(30px,6vw,50px);
    background:var(--header-gradient);
    background-size:300% 300%;
    animation:shimmer 8s ease infinite;
    position:relative; overflow:hidden;
    border-bottom:2px solid var(--purple);
    transition:background var(--transition);
}
header::before{
    content:''; position:absolute; width:400px; height:400px;
    background:radial-gradient(circle,rgba(255,170,0,.08),transparent);
    top:-150px; left:-150px; animation:float 8s infinite; pointer-events:none;
}
header::after{
    content:''; position:absolute; width:300px; height:300px;
    background:radial-gradient(circle,rgba(179,102,255,.08),transparent);
    bottom:-100px; right:-100px; animation:float 8s infinite reverse; pointer-events:none;
}
.header-controls{
    position:absolute; top:clamp(10px,2vw,20px); right:clamp(10px,2vw,20px);
    display:flex; gap:8px; z-index:10;
}
.ctrl-btn{
    background:var(--toggle-bg); border:1px solid var(--toggle-border);
    color:var(--text); padding:8px 14px; border-radius:30px; cursor:pointer;
    font-family:inherit; font-size:clamp(.8em,1.5vw,.95em); font-weight:600;
    display:inline-flex; align-items:center; gap:6px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:all .3s ease; white-space:nowrap; min-height:42px;
    -webkit-tap-highlight-color:transparent;
}
.ctrl-btn:hover{background:var(--toggle-hover);transform:translateY(-2px)}
.ctrl-btn:active{transform:translateY(0)}
.ctrl-btn:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.theme-toggle{font-size:1.15em;padding:8px 12px;min-width:48px;justify-content:center}
header h1{
    font-size:clamp(2em,8vw,3.2em); margin-bottom:10px;
    position:relative; z-index:1; word-break:break-word;
    background:linear-gradient(135deg,var(--gold),var(--purple),var(--gold));
    background-size:300% 300%;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    animation:gradientMove 4s ease-in-out infinite;
}
header .subtitle{
    color:var(--gray); font-size:clamp(1em,3vw,1.25em);
    position:relative; z-index:1; max-width:700px; margin:0 auto;
}
.version-badge{
    display:inline-block;
    background:linear-gradient(135deg,var(--purple),#7a2e8a);
    color:#fff; padding:6px 20px; border-radius:30px;
    font-size:clamp(.8em,2vw,1em); margin-top:12px;
    position:relative; z-index:1;
    animation:pulse 2s infinite;
    box-shadow:0 0 30px rgba(179,102,255,.2);
}
.badges{
    margin-top:20px; position:relative; z-index:1;
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
}
.badges img{max-width:100%;height:auto;transition:.3s}
.badges img:hover{transform:scale(1.05)}

/* ===== SECTIONS ===== */
section{margin:clamp(30px,6vw,50px) 0}
h2{
    color:var(--gold); border-bottom:2px solid var(--purple);
    padding-bottom:8px; margin-bottom:25px;
    font-size:clamp(1.4em,4vw,1.8em);
    transition:color var(--transition);
}

/* ===== FEATURES ===== */
.features{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));
    gap:clamp(15px,3vw,20px);
}
.feature-card{
    background:var(--card); padding:clamp(18px,3vw,25px);
    border-radius:16px; border-left:4px solid var(--purple);
    transition:transform .5s cubic-bezier(.175,.885,.32,1.275),
               box-shadow .3s,border-color .3s,background var(--transition);
    cursor:default;
}
.feature-card:hover{
    transform:translateY(-10px) scale(1.02);
    box-shadow:0 20px 40px var(--shadow);
    border-left-color:var(--gold);
}
.feature-card h3{color:var(--gold);margin-bottom:10px;font-size:clamp(1em,2vw,1.2em)}
.feature-card p{font-size:clamp(.9em,1.5vw,1em)}

/* ===== TABLE ===== */
.table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0;border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{
    padding:clamp(10px,2vw,14px); text-align:left;
    border-bottom:1px solid var(--border);
    font-size:clamp(.85em,1.5vw,1em);
    transition:background var(--transition);
}
th{color:var(--gold);font-size:clamp(.95em,1.8vw,1.1em);background:var(--card)}
tr{transition:background .3s}
tr:hover{background:var(--hover-row)}
table code{
    font-size:clamp(.75em,1.2vw,.9em); white-space:nowrap;
    font-family:'Courier New',monospace;
    color:var(--yellow); background:var(--code-bg);
    padding:2px 6px; border-radius:4px;
}

/* ===== LANGUAGES ===== */
.lang-grid{display:flex;flex-wrap:wrap;gap:clamp(6px,1.5vw,10px);justify-content:center}
.lang-item{
    background:var(--card);
    padding:clamp(6px,1.5vw,10px) clamp(12px,2.5vw,18px);
    border-radius:30px;
    font-size:clamp(.8em,1.5vw,.95em);
    border:1px solid var(--border);
    transition:all .4s ease;
    cursor:default; white-space:nowrap;
    opacity:0; transform:translateY(20px);
}
.lang-item.visible{opacity:1;transform:translateY(0)}
.lang-item:hover{
    transform:scale(1.08);
    background:var(--purple); color:#fff;
    border-color:var(--purple);
    box-shadow:0 10px 30px rgba(179,102,255,.3);
}

/* ===== TUTORIAL ===== */
.tutorial{
    background:var(--card); padding:clamp(20px,4vw,30px);
    border-radius:16px;
    transition:box-shadow .3s,background var(--transition);
}
.tutorial:hover{box-shadow:0 10px 30px var(--shadow)}
.tutorial h3{
    color:var(--gold);
    margin:clamp(20px,3vw,25px) 0 clamp(8px,1.5vw,12px);
    font-size:clamp(1.1em,2.5vw,1.4em);
}
.tutorial h3:first-child{margin-top:0}
.tutorial code{
    background:var(--code-bg); padding:3px 10px; border-radius:6px;
    color:var(--yellow); font-size:clamp(.8em,1.3vw,.95em);
    word-break:break-word; font-family:'Courier New',monospace;
}
.tutorial pre{
    background:var(--pre-bg); padding:clamp(12px,2vw,18px);
    border-radius:8px; overflow-x:auto;
    color:var(--green); margin:12px 0;
    font-size:clamp(.8em,1.3vw,.95em);
    border-left:3px solid var(--purple);
    white-space:pre-wrap; word-break:break-word;
    font-family:'Courier New',monospace;
    transition:background var(--transition);
}
.tutorial p{font-size:clamp(.9em,1.5vw,1em)}
.step{
    display:flex; gap:15px; margin:15px 0; flex-wrap:wrap; align-items:flex-start;
    opacity:0; transform:translateX(-20px);
    transition:opacity .6s ease,transform .6s ease;
}
.step.visible{opacity:1;transform:translateX(0)}
.step-num{
    background:var(--purple); color:#fff;
    width:35px; height:35px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; flex-shrink:0;
    font-size:clamp(.9em,1.5vw,1em);
}
.step-content{flex:1;min-width:0;width:100%}

/* ===== PLATFORM BUTTONS ===== */
.platform-buttons{
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center;
    margin:30px 0;
}
.platform-btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:12px 24px; border-radius:60px;
    text-decoration:none; font-family:inherit; font-weight:600;
    font-size:.95em; color:#fff;
    border:1px solid rgba(255,255,255,.08); cursor:pointer;
    transition:all .5s cubic-bezier(.23,1,.32,1);
    box-shadow:0 4px 20px rgba(0,0,0,.3);
    position:relative; overflow:hidden;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    animation:subtleFloat 4s ease-in-out infinite;
    min-height:48px; -webkit-tap-highlight-color:transparent;
}
.platform-btn svg{
    width:22px; height:22px; fill:currentColor; flex-shrink:0;
    transition:transform .5s cubic-bezier(.34,1.56,.64,1);
    position:relative; z-index:2;
}
.platform-btn > span:not(.badge):not(.btn-glow){position:relative;z-index:2}
.platform-btn .badge{
    background:rgba(255,255,255,.15); padding:2px 10px; border-radius:30px;
    font-size:.65em; font-weight:600; color:rgba(255,255,255,.9);
    border:1px solid rgba(255,255,255,.1);
    transition:all .4s ease; letter-spacing:.3px;
    position:relative; z-index:2;
}
.platform-btn .btn-glow{
    position:absolute; inset:-2px; border-radius:62px;
    background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.3),transparent 60%);
    opacity:0; transition:opacity .6s ease; z-index:0;
    animation:rotateGlow 3s linear infinite; pointer-events:none;
}
.platform-btn:hover .btn-glow{opacity:1}
.platform-btn:hover{transform:translateY(-4px) scale(1.05);animation-play-state:paused}
.platform-btn:hover svg{transform:rotate(-6deg) scale(1.1);filter:drop-shadow(0 0 16px rgba(255,255,255,.2))}
.github-btn{background:linear-gradient(135deg,#24292e,#1a1a2e)}
.github-btn:hover{box-shadow:0 12px 40px rgba(110,84,148,.35)}
.github-btn .btn-glow{background:conic-gradient(from 0deg,transparent,rgba(179,102,255,.5),transparent 60%)}
.modrinth-btn{background:linear-gradient(135deg,#1bd96a,#0fa84a)}
.modrinth-btn:hover{box-shadow:0 12px 40px rgba(27,217,106,.35)}
.modrinth-btn .btn-glow{background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.5),transparent 60%)}
.spigot-btn{background:linear-gradient(135deg,#db6a1b,#a84a0f)}
.spigot-btn:hover{box-shadow:0 12px 40px rgba(219,106,27,.35)}
.spigot-btn .btn-glow{background:conic-gradient(from 0deg,transparent,rgba(255,200,100,.5),transparent 60%)}

/* ===== FOOTER ===== */
footer{
    text-align:center; padding:clamp(20px,4vw,30px);
    color:var(--gray); border-top:1px solid var(--border);
    margin-top:clamp(30px,6vw,50px);
}
footer p{font-size:clamp(.85em,1.5vw,1em);margin:4px 0}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
    .header-controls{position:static;justify-content:center;margin-bottom:24px}
    .ctrl-btn{font-size:.85em}
}
@media(max-width:600px){
    header::before,header::after{display:none}
    .table-wrapper{margin:10px calc(-1 * clamp(15px,3vw,20px));padding:0 clamp(15px,3vw,20px)}
    table{min-width:400px}
    .lang-item{white-space:normal;font-size:.8em}
    .platform-btn{padding:10px 18px;font-size:.85em;gap:8px}
    .platform-btn svg{width:18px;height:18px}
    .platform-btn .badge{display:none}
}
@media(max-width:400px){
    table{min-width:320px}
    th,td{padding:8px;font-size:.75em}
    table code{font-size:.7em}
    .feature-card{padding:15px}
    .platform-btn{padding:8px 14px;font-size:.75em;gap:6px;border-radius:40px}
    .platform-btn svg{width:16px;height:16px}
    .ctrl-btn{padding:6px 10px;font-size:.75em;min-height:38px}
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-alt)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--purple)}
</style>
</head>

/* =========================================================
   STATE & HELPERS
   ========================================================= */
let currentLang = 'en';
let currentTheme = 'dark';
let fadeObserver = null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function applyTheme(theme){
    currentTheme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    try{ localStorage.setItem('customtpa-theme', theme); }catch(e){}
    const btn = document.getElementById('themeToggle');
    btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    const label = theme === 'dark'
        ? (currentLang==='ru'?'Переключить на светлую тему':'Switch to light theme')
        : (currentLang==='ru'?'Переключить на тёмную тему':'Switch to dark theme');
    btn.setAttribute('aria-label', label);
    document.getElementById('metaTheme').setAttribute('content', theme==='dark'?'#0d0d0d':'#f4f4f8');
}

/* =========================================================
   RENDERERS
   ========================================================= */
function renderBadges(t){
    document.getElementById('badges').innerHTML = `
        <img src="https://img.shields.io/bstats/servers/32220?label=${encodeURIComponent(t.badgeServers)}&style=flat-square" alt="${esc(t.badgeServers)}" loading="lazy">
        <img src="https://img.shields.io/bstats/players/32220?label=${encodeURIComponent(t.badgePlayers)}&style=flat-square" alt="${esc(t.badgePlayers)}" loading="lazy">
        <img src="https://img.shields.io/modrinth/dt/customtpa?label=${encodeURIComponent(t.badgeDownloads)}&style=flat-square" alt="${esc(t.badgeDownloads)}" loading="lazy">
    `;
}

function renderFeatures(t){
    document.getElementById('featuresGrid').innerHTML = t.features.map(f => `
        <div class="feature-card">
            <h3>${f.icon} ${esc(f.title)}</h3>
            <p>${esc(f.desc)}</p>
        </div>
    `).join('');
}

function renderCommands(t){
    document.getElementById('commandsBody').innerHTML = t.commands.map(c => `
        <tr><td><code>${c.cmd}</code></td><td>${esc(c.desc)}</td></tr>

}

function renderLanguages(){
    document.getElementById('langGrid').innerHTML =
        SUPPORTED_LANGUAGES.map(l => `<span class="lang-item">${esc(l)}</span>`).join('');
}

function renderTutorial(t){
    const tt = t.tutorial;
    let html = '';

    html += `<h3>${esc(tt.installTitle)}</h3>`;
    tt.installSteps.forEach(s => {
        html += `<div class="step">
            <div class="step-num">${s.num}</div>
            <div class="step-content">${s.html}${s.pre ? `<pre>${esc(s.pre)}</pre>` : ''}</div>
        </div>`;
    });

    html += `<h3>${esc(tt.configTitle)}</h3>`;
    html += `<pre>${esc(tt.configContent)}</pre>`;

    html += `<h3>${esc(tt.messagesTitle)}</h3>`;
    html += `<p>${tt.messagesDesc}</p>`;
    html += `<pre>${esc(tt.messagesExample)}</pre>`;

    html += `<h3>${esc(tt.addLangTitle)}</h3>`;
    html += `<p>${tt.addLangDesc}</p>`;

    html += `<h3>${esc(tt.permsTitle)}</h3>`;
    html += `<p>${esc(tt.permsDesc)}</p>`;
    html += `<pre>${esc(tt.permsContent)}</pre>`;

    html += `<h3>${esc(tt.placeholdersTitle)}</h3>`;
    html += `<p>${esc(tt.placeholdersDesc)}</p>`;
    html += `<pre>${esc(tt.placeholdersContent)}</pre>`;

    document.getElementById('tutorial').innerHTML = html;
}

function renderContent(lang){
    currentLang = lang;
    const t = translations[lang];

    document.documentElement.setAttribute('lang', lang);
    document.title = t.pageTitle;
    try{ localStorage.setItem('customtpa-lang', lang); }catch(e){}

    /* data-i18n text updates */
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
    });

    /* update lang button */
    const langBtn = document.getElementById('langToggle');
    langBtn.textContent = lang === 'en' ? '🇷🇺 Русский' : '🇬🇧 English';
    langBtn.setAttribute('aria-label', lang === 'en' ? 'Переключить на русский' : 'Switch to English');

    /* refresh theme button aria-label according to language */
    applyTheme(currentTheme);

    /* dynamic sections */
    renderBadges(t);
    renderFeatures(t);
    renderCommands(t);
    renderLanguages();
    renderTutorial(t);

    /* fade-in for new elements */
    initFadeIn();
}

/* =========================================================
   FADE-IN OBSERVER
   ========================================================= */
function initFadeIn(){
    const elements = document.querySelectorAll('.fade-in, .feature-card, .lang-item, .step');

    elements.forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) {
            el.classList.add('visible');
        }
    });

    if (fadeObserver) fadeObserver.disconnect();
    if (!('IntersectionObserver' in window)) {
        elements.forEach(el => el.classList.add('visible'));
        return;
    }
    fadeObserver = new IntersectionObserver(entries => {
        entries.forEach(e => {
            if (e.isIntersecting) e.target.classList.add('visible');
        });
    }, { threshold: 0.1 });

    elements.forEach(el => {
        if (!el.classList.contains('visible')) fadeObserver.observe(el);
    });
}

/* =========================================================
   INIT
   ========================================================= */
(function init(){
    /* ---- language ---- */
    let lang;
    try{ lang = localStorage.getItem('customtpa-lang'); }catch(e){}
    if (!lang) {
        const bl = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
        lang = bl.startsWith('ru') ? 'ru' : 'en';
    }
    if (!['en','ru'].includes(lang)) lang = 'en';

    /* ---- theme ---- */
    let theme;
    try{ theme = localStorage.getItem('customtpa-theme'); }catch(e){}
    if (!theme) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light' : 'dark';
    }
    applyTheme(theme);

    /* ---- render ---- */
    renderContent(lang);

    /* ---- controls ---- */
    document.getElementById('langToggle').addEventListener('click', () => {
        renderContent(currentLang === 'en' ? 'ru' : 'en');
    });
    document.getElementById('themeToggle').addEventListener('click', () => {
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    /* ---- re-check fade-in on resize (rare but cheap) ---- */
    let rt;
    window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(initFadeIn, 200);
    }, { passive: true });
})();
